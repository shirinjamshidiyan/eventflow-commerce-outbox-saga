server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: inventory-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/inventorydb}
    username:  ${DB_USERNAME:user2}
    password:  ${DB_PASSWORD:pass2}

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

    listener:
      ack-mode: batch

app:
  kafka:
    topics:
      order-created: order.created
      inventory-reserved: inventory.reserved
      inventory-reservation-failed: inventory.reservation.failed
      inventory-release-requested: inventory.release.requested
      inventory-released: inventory.released
  outbox:
    claim-limit: 20
    max-retries: 10
    fixed-delay-ms: 5000
    recovery-delay-ms: 60000

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} correlationId=%X{correlationId} eventId=%X{eventId} eventType=%X{eventType} causationId=%X{causationId} source=%X{source} orderId=%X{orderId} requestId=%X{requestId} - %msg%n"
  level:
    root: INFO
    com.shirin: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
    org.hibernate: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always