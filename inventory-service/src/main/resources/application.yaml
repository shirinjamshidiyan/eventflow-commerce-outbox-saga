server:
  port: 8082

spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5434/inventorydb
    username: user2
    password: pass2

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
    producer:
      properties:
        acks: all

app:
  kafka:
    topics:
      order-created: order.created.v1
      inventory-reserved: inventory.reserved.v1
      inventory-reservation-failed: inventory.reservation-failed.v1
  outbox:
    claim-limit: 20
    max-retries: 10
    fixed-delay-ms: 5000
    recovery-delay-ms: 60000