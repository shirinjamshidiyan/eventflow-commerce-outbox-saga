server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: order-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/orderdb}
    username: ${DB_USERNAME:user1}
    password: ${DB_PASSWORD:pass1}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
    producer:
      properties:
        acks: all

app:
  kafka:
    topics:
      order-created: order.created.v1
      inventory-reserved: inventory.reserved.v1
      inventory-reservation-failed: inventory.reservation.failed.v1
      inventory-release-requested: inventory.release.requested.v1
      inventory-released: inventory.released.v1
      payment-requested: payment.requested.v1
      payment-authorized: payment.authorized.v1
      payment-failed: payment.failed.v1


  outbox:
    claim-limit: 20
    max-retries: 10
    fixed-delay-ms: 5000
    recovery-delay-ms: 60000

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} correlationId=%X{correlationId} eventId=%X{eventId} eventType=%X{eventType} causationId=%X{causationId} source=%X{source} orderId=%X{orderId} requestId=%X{requestId} - %msg%n"

  level:
    root: INFO
    com.shirin: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
    org.hibernate: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always