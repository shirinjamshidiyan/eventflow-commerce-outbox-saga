
server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: order-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/orderdb}
    username: ${DB_USERNAME:user1}
    password: ${DB_PASSWORD:pass1}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
    producer:
      properties:
        acks: all

app:
  kafka:
    topics:
      order-created: order.created.v1
      inventory-reserved: inventory.reserved.v1
      inventory-reservation-failed: inventory.reservation-failed.v1
  outbox:
    claim-limit: 20
    max-retries: 10
    fixed-delay-ms: 5000
    recovery-delay-ms: 60000